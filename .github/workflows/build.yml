name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unpack project
        run: |
          unzip -q AutoClicker.zip
          chmod -R u+w AutoClicker
          echo "android.useAndroidX=true" >> AutoClicker/gradle.properties
      - name: Build
        working-directory: AutoClicker
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-apk
          path: AutoClicker/app/build/outputs/apk/debug/app-debug.apk
